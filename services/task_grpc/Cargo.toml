[package]
name = "task_grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
prost = "0.13.5"
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.5", features = ["runtime-tokio", "postgres", "macros"] }
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros"] }
tonic = "0.13.0"
tonic-build = "0.13.0"


[build-dependencies]
tonic-build = "0.13.0"
