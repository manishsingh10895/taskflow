version: "3.9"
services:
  auth:
    build: ./services/auth
    ports:
      - "8001:8000"
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
  redis:
    image: redis:6
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: password
