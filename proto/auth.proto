syntax = "proto3";

package auth;

service AuthService {
  rpc GetUserInfo (UserRequest) returns (UserResponse);
  rpc DeleteUser (UserRequest) returns (DeleteUserResponse);
}

message UserRequest {
  int32 user_id = 1;
}

message UserResponse {
  int32 user_id = 1;
  string email = 2;
  string username = 3;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}
