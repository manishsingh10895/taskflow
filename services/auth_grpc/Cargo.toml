[package]
name = "auth_grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros"] }
tonic = "0.13.0"
prost = "0.13.0"
tonic-build = "0.13.0"
dotenv = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7.0", features = ["runtime-tokio", "postgres", "macros"] }


[build-dependencies]
tonic-build = "0.13.0"
